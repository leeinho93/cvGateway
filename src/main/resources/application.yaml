# Cisco Cyber Vision Classic API (Swagger 2.0, basePath /api/3.0)
# 스펙 원본: src/main/resources/openapi/cyber-vision-3.0.json
cyber-vision:
  # Center 주소와 API 토큰은 여기에 두지 않는다.
  # 외부 시스템이 POST /api/cyber-vision/connection 으로 주입하고,
  # cv_connection 테이블(DDL: src/main/resources/db/cv_connection.sql)에 보관된다.
  # 기동 시 DB 에서 가장 최근 것을 읽어 메모리에 올린다.

  # API 베이스 경로. 스펙의 basePath 로, 환경이 아니라 API 계약에 속하므로 설정에 남긴다.
  base-path: /api/3.0
  accept-language: en

  # 접속 정보 등록 시 GET /version 을 한 번 호출해 유효성을 확인한다.
  # 401 이 오면 등록을 거부하고, Center 에 닿지 못하면 경고만 남기고 통과시킨다.
  validate-token-on-update: true

  # 현재 상태 데이터를 주기적으로 받아 캐시에 올린다.
  # 데이터가 바뀌는 속도에 따라 등급을 나누고, 등급마다 스케줄러 하나가 해당 항목을 한 번에 조회한다.
  polling:
    # 접속 정보가 준비된 뒤 켠다. 꺼져 있으면 스케줄러 빈 자체가 만들어지지 않는다.
    enabled: ${CV_POLLING_ENABLED:false}
    initial-delay: 10000
    fast: 60000      # 1분  - 센서 상태, 최근 이벤트
    normal: 300000   # 5분  - 대시보드 집계, 리스크/취약 디바이스, 프로토콜 분포
    slow: 1800000    # 30분 - 자산 목록, 취약점 목록, 능동탐색 프로필, 태그, 베이스라인
    rare: 21600000   # 6시간 - 그룹(존), 네트워크, 프리셋, 버전, 센서 폴더

    # 프리셋 단위 데이터를 받아올 프리셋 ID.
    # 대시보드 계열 상당수가 preset_id 를 요구하는데, 프리셋 전체를 돌면
    # 프리셋 수 x 엔드포인트 수만큼 호출이 곱해진다. 화면이 실제로 쓰는 것만 지정한다.
    # 비어 있으면 프리셋 단위 폴링을 하지 않는다. ID 는 GET /api/cache/presets 로 확인.
    preset-ids: []
    # preset-ids:
    #   - 86bc937a-19cf-5f0a-9b28-1f9a8347590e

    # 보안 인사이트를 받아올 프로토콜 유형. 스펙 허용값은 dns, http, smb 뿐이다.
    # 프리셋 하나당 이 유형 수만큼 호출이 늘어난다.
    security-insight-types:
      - dns
      - http
      - smb

# springdoc 설정은 spring.* 이 아니라 springdoc.* 아래여야 인식된다.
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8087
spring:
  application:
    name: cvGateway
  datasource:
    #logging용
    #driver-class-name: net.sf.log4jdbc.sql.jdbcapi.DriverSpy
    #url: jdbc:log4jdbc:sqlserver://192.168.2.151:1433;databaseName=dsaWatcher;username=dw;password=dw;sendStringParametersAsUnicode=false;
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    #sendStringParametersAsUnicode=false 추가
    #https://sqlwizardblog.wordpress.com/2018/07/29/performance-impact-of-jdbc-connectionstring-property-sendstringparametersasunicode/
    url: jdbc:sqlserver://localhost:1433;databaseName=dsaWatcher;username=dw;password=dw;sendStringParametersAsUnicode=false;encrypt=false;loginTimeout=10;
    #url: jdbc:sqlserver://192.168.0.15:1433;databaseName=dsaWatcher;username=dw;password=dw;sendStringParametersAsUnicode=false;encrypt=false;loginTimeout=10;
    hikari:
      connection-timeout: 30000    # 커넥션 타임 아웃 (10s) - DB 장애 시 스레드 빠른 실패 처리
      #idle-timeout: 600000        # pool 미사용 커넥션 유지 시간 (10m)
      max-lifetime: 1800000       # pool 에서 커넥션 최대 수명 시간 (30m) - 죽은 연결 자동 교체
      keepalive-time: 30000       # DB가 유휴 연결을 끊기 전에 keepalive 전송 (30s)
      #minimum-idle: 150          # 최소 커넥션 유지 개수 (default: same as maximumPoolSize)
      maximum-pool-size: 10 # pool에 유지시킬 수 있는 최대 커넥션 수
      pool-name: dw-hikari-pool
      data-source-properties:
        cachePrepStmts: true
        prepStmtCacheSize: 250
        prepStmtCacheSqlLimit: 2048
        useServerPrepStmts: true
        useLocalSessionState: true
        rewriteBatchedStatements: true
        cacheResultSetMetadata: true
        cacheServerConfiguration: true
        elideSetAutoCommits: true
        maintainTimeStats: false
  jpa:
    open-in-view: false
    generate-ddl: false
    show-sql: false
    hibernate:
      ddl-auto: update
      #ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        generate_statistics: false
        jdbc:
          batch_size: 100
        order_inserts: true
        dialect: org.hibernate.dialect.SQLServerDialect