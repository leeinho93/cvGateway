plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.8'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.cvGateway'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('springCloudVersion', "2025.1.3")
}

dependencies {


	// 직접 추가: Swagger (springdoc-openapi, springfox 아님 - 구버전이라 죽었음)
	// 3.x 라인이 Spring Boot 4 / Spring 7 대응이다.
	// 2.6.0 은 Spring 7 에서 사라진 ControllerAdviceBean(Object) 생성자를 호출해
	// /api-docs 요청이 NoSuchMethodError 로 터진다 (Swagger 의 "Failed to load API definition").
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

	// === DB 미사용 모드 ===
	// DB 없이 기동하기 위해 JPA 와 MS SQL 드라이버를 내렸다.
	// 되살릴 때는 아래 세 줄과 함께
	//   - application.yaml 의 spring.datasource / spring.jpa 블록
	//   - CyberVisionConnectionEntity / CyberVisionConnectionRepository
	//   - CyberVisionConnectionService 의 repository 관련 코드
	// 를 같이 복구한다.
	//implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
	// Feign 기본 클라이언트(HttpURLConnection)는 PATCH 를 지원하지 않는다.
	// Cyber Vision API 에 PATCH 오퍼레이션이 6개 있어 Apache HttpClient 5 구현이 필요하다.
	implementation 'io.github.openfeign:feign-hc5'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	//ms-sql
	//implementation 'com.microsoft.sqlserver:mssql-jdbc:12.6.2.jre11'
	annotationProcessor 'org.projectlombok:lombok'
	//testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'



}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
